<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;display=swap');
      text { font-family: 'Montserrat', Arial, sans-serif; }
    </style>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- icon badge -->
  <rect x="30" y="40" width="80" height="80" rx="20" fill="url(#badge)"/>

  <!-- graduation cap glyph -->
  <g transform="translate(30,40)">
    <polygon points="40,16 62,30 40,44 18,30" fill="#ffffff"/>
    <ellipse cx="40" cy="44" rx="13" ry="8" fill="#ffffff" opacity="0.95"/>
    <line x1="62" y1="30" x2="58" y2="58" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="58" r="4" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="140" y="80" font-size="46" font-weight="800" fill="#ffffff" dominant-baseline="central">EduManage</text>
</svg>
