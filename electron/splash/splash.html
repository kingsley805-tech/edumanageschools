<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;" />
  <title>EduManage</title>
  <style>
    :root {
      --bg1: #0b3d2e;
      --bg2: #0f766e;
      --fg: #ecfdf5;
      --muted: #a7f3d0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: "Segoe UI", Manrope, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #134e4a, var(--bg1) 55%, #052e26);
      color: var(--fg);
      -webkit-app-region: drag;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      background: linear-gradient(145deg, #34d399, #0d9488);
      display: grid; place-items: center;
      font-weight: 800; font-size: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      margin: 0 auto 16px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
    p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .bar {
      width: 180px; height: 4px; margin: 22px auto 0;
      border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.12);
    }
    .bar > i {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #6ee7b7, #99f6e4);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="logo">E</div>
      <h1>EduManage</h1>
      <p>Starting desktop services…</p>
      <div class="bar"><i></i></div>
    </div>
  </div>
</body>
</html>
