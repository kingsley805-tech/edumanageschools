services:
  web:
    image: node:20-alpine
    container_name: edumanage_web_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}
    command: sh -c "npm install --ignore-scripts && npm run dev -- --host 0.0.0.0 --port 5173"

  voice-gateway:
    image: node:20-alpine
    container_name: edumanage_voice_gateway_dev
    working_dir: /app/server/voice-gateway
    volumes:
      - ./server/voice-gateway:/app/server/voice-gateway
      - /app/server/voice-gateway/node_modules
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - SUPABASE_URL=${SUPABASE_URL:-${VITE_SUPABASE_URL}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    command: sh -c "npm install && npm run dev"
