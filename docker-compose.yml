services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-http://localhost:8080}
    image: edumanage-web:latest
    container_name: edumanage_web
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      - PORT=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  voice-gateway:
    platform: linux/amd64
    build:
      context: ./server/voice-gateway
      dockerfile: Dockerfile
    image: edumanage-voice-gateway:latest
    container_name: edumanage_voice_gateway
    ports:
      - "${VOICE_GATEWAY_PORT:-8088}:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-gpt-4o-realtime-preview}
      - OPENAI_VOICE=${OPENAI_VOICE:-alloy}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - VOICE_SUPPORT_NUMBER=${VOICE_SUPPORT_NUMBER:-}
      - VOICE_MAX_CALL_DURATION=${VOICE_MAX_CALL_DURATION:-600}
      - VOICE_RECORDING_ENABLED=${VOICE_RECORDING_ENABLED:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:8088/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
